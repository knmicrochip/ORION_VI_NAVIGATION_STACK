# YOLOv8 dataset configuration for ERC 2026 Maintenance Panel detection
# https://docs.ultralytics.com/datasets/detect/

# After annotation, populate these paths relative to this file
# or use absolute paths on your training machine.
path: ./  # dataset root (change to absolute path if needed)
train: images/train
val: images/val
test: images/test

# Class definitions matching the ERC 2026 Maintenance Panel elements.
# Panel spec: 330mm x 450mm, industrial-grade switches.
names:
  0: main_switch_off
  1: main_switch_on
  2: lever_switch_up
  3: lever_switch_down
  4: rotary_switch
  5: socket_empty
  6: socket_plugged
  7: rotary_power_switch
  8: indicator_off
  9: indicator_on
