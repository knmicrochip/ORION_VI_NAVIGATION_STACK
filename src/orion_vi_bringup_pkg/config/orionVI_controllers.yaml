controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    swerve_drive_controller:
      type: swerve_drive_controller/SwerveController


swerve_drive_controller:
  ros__parameters:
      front_left_wheel_joint: "wheel_F_L_joint"
      front_right_wheel_joint: "wheel_F_R_joint"
      rear_left_wheel_joint: "wheel_R_L_joint"
      rear_right_wheel_joint: "wheel_R_R_joint"
      
      front_left_axle_joint: "turntable_F_L_joint"
      front_right_axle_joint: "turntable_F_R_joint"
      rear_left_axle_joint: "turntable_R_L_joint"
      rear_right_axle_joint: "turntable_R_R_joint"
      
      wheelbase: 0.840 
      trackwidth: 0.843
      wheel_radius: 0.21
      
      front_left_velocity_threshold: 2.0
      front_right_velocity_threshold: 2.0
      rear_left_velocity_threshold: 2.0
      rear_right_velocity_threshold: 2.0

      max_steering_angles: [0.25, 0.5]
      
      pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]